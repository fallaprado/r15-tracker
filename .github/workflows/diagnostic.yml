name: Diagnosticar Renfe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  diagnostic:

    runs-on: ubuntu-latest

    steps:

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar requests
        run: |
          pip install requests

      - name: Consultar feed de Renfe
        run: |
          python - <<'PY'
          import requests
          import json

          URL = "https://gtfsrt.renfe.com/trip_updates.json"

          print("Consultant:")
          print(URL)
          print()

          response = requests.get(
              URL,
              timeout=30,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("HTTP:", response.status_code)
          print("Bytes:", len(response.content))
          print()

          response.raise_for_status()

          data = response.json()

          print("CLAUS PRINCIPALS:")
          print(list(data.keys()))
          print()

          entities = data.get("entity", [])

          print("NOMBRE ENTITATS:")
          print(len(entities))
          print()

          if entities:

              print("PRIMERA ENTITAT:")
              print(
                  json.dumps(
                      entities[0],
                      indent=2,
                      ensure_ascii=False
                  )
              )

          else:
              print("NO HI HA ENTITATS")
          PY
