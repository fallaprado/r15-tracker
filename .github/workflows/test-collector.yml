name: Recollir dades R15

on:
  workflow_dispatch:

  schedule:
    - cron: "10 22 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:

      - name: Descarregar repositori
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar dependències
        run: |
          pip install requests

      - name: Executar collector
        run: |
          python collector/collect.py

      - name: Comprovar fitxer generat
        run: |
          ls -lah data/
          echo "Fitxers JSON:"
          find data -name "*.json" -maxdepth 1

      - name: Guardar dades al repositori
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || git commit -m "Dades R15 $(date +'%Y-%m-%d')"

          git push
