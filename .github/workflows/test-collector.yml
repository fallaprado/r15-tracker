name: R15 Tracker

on:
  workflow_dispatch:

  schedule:
    # Crear/actualitzar les dades cada 5 minuts
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:

      - name: Descarregar repositori
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·lar dependències
        run: |
          pip install requests gtfs-realtime-bindings

      - name: Executar collector
        run: |
          python collector/collect.py

      - name: Executar dades en temps real
        run: |
          python collector/realtime.py

      - name: Guardar dades
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || git commit -m "Actualitzar dades R15 $(date +'%Y-%m-%d %H:%M')"

          git push
