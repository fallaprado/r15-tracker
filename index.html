
<!DOCTYPE html>
<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>R15 Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <h1>🚆 R15 Tracker</h1>

    <p>
        Històric de circulacions
        Barcelona ↔ Reus
    </p>

</header>


<main>


    <section class="controls">


        <div>

            <label for="direction">
                Sentit
            </label>

            <select id="direction">

                <option value="BAR_REUS">
                    Barcelona → Reus
                </option>

                <option value="REUS_BAR">
                    Reus → Barcelona
                </option>

            </select>

        </div>


        <div>

            <label for="date">
                Dia
            </label>

            <input
                type="date"
                id="date"
            >

        </div>


    </section>


    <section id="summary"></section>


    <section id="trains">

        <p class="loading">
            Carregant...
        </p>

    </section>


</main>


<script src="app.js"></script>


</body>

</html>
